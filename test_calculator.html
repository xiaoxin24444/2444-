<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器功能测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .test-section h3 {
            margin-top: 0;
            color: #667eea;
        }
        .test-item {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .test-item span {
            font-weight: bold;
            color: #333;
        }
        .result {
            color: #10b981;
            font-weight: bold;
        }
        .result.error {
            color: #ef4444;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #5a6fd6;
        }
        #testResults {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            display: none;
        }
        .test-pass {
            color: #10b981;
        }
        .test-fail {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <h1>🧮 计算器功能测试</h1>
    
    <div class="test-section">
        <h3>基础运算测试</h3>
        <div class="test-item">
            <span>5 + 3 =</span> <span class="result" id="test1"></span>
        </div>
        <div class="test-item">
            <span>10 - 3 =</span> <span class="result" id="test2"></span>
        </div>
        <div class="test-item">
            <span>7 × 6 =</span> <span class="result" id="test3"></span>
        </div>
        <div class="test-item">
            <span>20 ÷ 4 =</span> <span class="result" id="test4"></span>
        </div>
        <button onclick="runTests()">运行测试</button>
    </div>
    
    <div class="test-section">
        <h3>运算符优先级测试</h3>
        <div class="test-item">
            <span>10 - 3 × 2 =</span> <span class="result" id="test5"></span>
            <small>(预期: 4, 先乘后减)</small>
        </div>
        <div class="test-item">
            <span>5 + 6 ÷ 3 =</span> <span class="result" id="test6"></span>
            <small>(预期: 7, 先除后加)</small>
        </div>
        <div class="test-item">
            <span>8 ÷ 2 × 4 =</span> <span class="result" id="test7"></span>
            <small>(预期: 16, 从左到右)</small>
        </div>
        <div class="test-item">
            <span>2 + 3 × 4 - 5 =</span> <span class="result" id="test8"></span>
            <small>(预期: 9, 先乘后加减)</small>
        </div>
        <button onclick="runPriorityTests()">运行优先级测试</button>
    </div>
    
    <div class="test-section">
        <h3>小数运算测试</h3>
        <div class="test-item">
            <span>0.5 + 0.3 =</span> <span class="result" id="test9"></span>
        </div>
        <div class="test-item">
            <span>1.5 × 4 =</span> <span class="result" id="test10"></span>
        </div>
        <div class="test-item">
            <span>10 ÷ 4 =</span> <span class="result" id="test11"></span>
        </div>
        <button onclick="runDecimalTests()">运行小数测试</button>
    </div>
    
    <div class="test-section">
        <h3>错误处理测试</h3>
        <div class="test-item">
            <span>5 ÷ 0 =</span> <span class="result error" id="test12"></span>
            <small>(预期: 错误)</small>
        </div>
        <button onclick="runErrorTests()">运行错误测试</button>
    </div>
    
    <div id="testResults"></div>
    
    <script src="script.js"></script>
    <script>
        // 临时重写Calculator类以支持直接调用
        class CalculatorTester {
            constructor() {
                this.state = {
                    currentValue: '0',
                    previousValue: null,
                    operator: null,
                    shouldResetDisplay: false,
                    expression: '',
                    history: []
                };
            }
            
            // 复用原有的表达式解析器
            evaluateExpression(expression) {
                const expr = expression
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');
                
                const tokens = expr.match(/(\d+\.?\d*|\+|\-|\*|\/|\%)/g);
                
                if (!tokens) return 'ERROR';
                
                const intermediate = [];
                let i = 0;
                
                while (i < tokens.length) {
                    const token = tokens[i];
                    
                    if (token === '*' || token === '/' || token === '%') {
                        const left = parseFloat(intermediate.pop());
                        const right = parseFloat(tokens[i + 1]);
                        
                        if (isNaN(left) || isNaN(right)) return 'ERROR';
                        
                        let result;
                        if (token === '*') result = left * right;
                        else if (token === '/') {
                            if (right === 0) return 'ERROR';
                            result = left / right;
                        }
                        else if (token === '%') result = left % right;
                        
                        intermediate.push(result);
                        i += 2;
                    } else {
                        intermediate.push(token);
                        i++;
                    }
                }
                
                let result = parseFloat(intermediate[0]);
                i = 1;
                
                while (i < intermediate.length) {
                    const operator = intermediate[i];
                    const operand = parseFloat(intermediate[i + 1]);
                    
                    if (isNaN(result) || isNaN(operand)) return 'ERROR';
                    
                    if (operator === '+') result += operand;
                    else if (operator === '-') result -= operand;
                    
                    i += 2;
                }
                
                return result;
            }
            
            test(expression) {
                const result = this.evaluateExpression(expression);
                return result === 'ERROR' ? '错误' : result;
            }
        }
        
        const tester = new CalculatorTester();
        
        function runTests() {
            document.getElementById('test1').textContent = tester.test('5+3');
            document.getElementById('test2').textContent = tester.test('10-3');
            document.getElementById('test3').textContent = tester.test('7×6');
            document.getElementById('test4').textContent = tester.test('20÷4');
        }
        
        function runPriorityTests() {
            const result5 = tester.test('10-3×2');
            document.getElementById('test5').textContent = result5;
            document.getElementById('test5').className = result5 == 4 ? 'result' : 'result error';
            
            const result6 = tester.test('5+6÷3');
            document.getElementById('test6').textContent = result6;
            document.getElementById('test6').className = result6 == 7 ? 'result' : 'result error';
            
            const result7 = tester.test('8÷2×4');
            document.getElementById('test7').textContent = result7;
            document.getElementById('test7').className = result7 == 16 ? 'result' : 'result error';
            
            const result8 = tester.test('2+3×4-5');
            document.getElementById('test8').textContent = result8;
            document.getElementById('test8').className = result8 == 9 ? 'result' : 'result error';
        }
        
        function runDecimalTests() {
            document.getElementById('test9').textContent = tester.test('0.5+0.3');
            document.getElementById('test10').textContent = tester.test('1.5×4');
            document.getElementById('test11').textContent = tester.test('10÷4');
        }
        
        function runErrorTests() {
            document.getElementById('test12').textContent = tester.test('5÷0');
        }
    </script>
</body>
</html>
