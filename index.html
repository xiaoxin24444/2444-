<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线密码生成器工具箱</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部标签导航 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tool="password-generator">
                密码生成器
            </button>
            <button class="tab-btn" data-tool="calculator">
                计算器
            </button>
        </nav>

        <!-- 主容器 -->
        <main class="tool-container">
            <!-- 密码生成器工具 -->
            <section id="password-generator" class="tool-panel active">
                <div class="header">
                    <!-- AI 生成的密码锁图标 -->
                    <img src="https://aka.doubaocdn.com/s/xDOL1wU1Wu" alt="密码锁图标" class="header-icon">
                    <h1>🔐 在线密码生成器</h1>
                    <p>安全、随机、便捷的密码生成工具</p>
                </div>

                <div class="password-display">
                    <input type="text" id="passwordOutput" class="password-input" readonly placeholder="点击生成密码">
                    <button id="copyBtn" class="copy-btn">复制</button>
                </div>

                <div class="length-control">
                    <div class="length-label">
                        <span>密码长度</span>
                        <span class="length-value" id="lengthValue">16</span>
                    </div>
                    <input type="range" id="lengthSlider" min="4" max="64" value="16">
                </div>

                <div class="options">
                    <div class="options-title">字符类型</div>
                    <label class="option-item">
                        <input type="checkbox" id="uppercase" checked>
                        <span class="option-label">大写字母</span>
                        <span class="option-sample">A-Z</span>
                    </label>
                    <label class="option-item">
                        <input type="checkbox" id="lowercase" checked>
                        <span class="option-label">小写字母</span>
                        <span class="option-sample">a-z</span>
                    </label>
                    <label class="option-item">
                        <input type="checkbox" id="numbers" checked>
                        <span class="option-label">数字</span>
                        <span class="option-sample">0-9</span>
                    </label>
                    <label class="option-item">
                        <input type="checkbox" id="symbols">
                        <span class="option-label">特殊符号</span>
                        <span class="option-sample">!@#$%</span>
                    </label>
                </div>

                <div class="strength-indicator">
                    <span class="strength-label">密码强度</span>
                    <div class="strength-bar">
                        <div class="strength-segment" id="segment1"></div>
                        <div class="strength-segment" id="segment2"></div>
                        <div class="strength-segment" id="segment3"></div>
                        <div class="strength-segment" id="segment4"></div>
                    </div>
                    <div class="strength-text" id="strengthText">请先生成密码</div>
                </div>

                <button id="generateBtn" class="generate-btn">生成密码</button>

                <!-- 密码历史记录区域 -->
                <div class="password-history">
                    <div class="history-header">
                        <span>历史记录</span>
                        <button id="exportBtn" class="export-btn">导出 JSON</button>
                    </div>
                    <div id="historyList" class="history-list"></div>
                </div>

                <!-- 快捷键提示 -->
                <div class="shortcut-hints">
                    <span class="shortcut-label">快捷键</span>
                    <span class="shortcut-item"><kbd>Ctrl</kbd>+<kbd>G</kbd> 生成</span>
                    <span class="shortcut-item"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> 复制</span>
                    <span class="shortcut-item"><kbd>Esc</kbd> 关闭提示</span>
                </div>

                <div class="footer">
                    生活效率工具箱 · 安全可靠
                </div>
            </section>

            <!-- 计算器工具 -->
            <section id="calculator" class="tool-panel">
                <div class="header">
                    <!-- AI 生成的计算器图标 -->
                    <img src="https://aka.doubaocdn.com/s/QWHx1wU1Wu" alt="计算器图标" class="header-icon">
                    <h1>🧮 简易计算器</h1>
                    <p>快速准确的数学计算工具</p>
                </div>

                <div class="calculator">
                    <input type="text" id="calcDisplay" class="calc-display" readonly placeholder="0">
                    <div class="calc-buttons">
                        <button class="calc-btn function" data-action="clear">C</button>
                        <button class="calc-btn function" data-action="backspace">⌫</button>
                        <button class="calc-btn operator" data-action="operator" data-value="%">%</button>
                        <button class="calc-btn operator" data-action="operator" data-value="/">÷</button>
                        <button class="calc-btn number" data-action="number" data-value="7">7</button>
                        <button class="calc-btn number" data-action="number" data-value="8">8</button>
                        <button class="calc-btn number" data-action="number" data-value="9">9</button>
                        <button class="calc-btn operator" data-action="operator" data-value="*">×</button>
                        <button class="calc-btn number" data-action="number" data-value="4">4</button>
                        <button class="calc-btn number" data-action="number" data-value="5">5</button>
                        <button class="calc-btn number" data-action="number" data-value="6">6</button>
                        <button class="calc-btn operator" data-action="operator" data-value="-">-</button>
                        <button class="calc-btn number" data-action="number" data-value="1">1</button>
                        <button class="calc-btn number" data-action="number" data-value="2">2</button>
                        <button class="calc-btn number" data-action="number" data-value="3">3</button>
                        <button class="calc-btn operator" data-action="operator" data-value="+">+</button>
                        <button class="calc-btn number zero" data-action="number" data-value="0">0</button>
                        <button class="calc-btn number" data-action="decimal" data-value=".">.</button>
                        <button class="calc-btn equals" data-action="equals">=</button>
                    </div>
                </div>

                <div class="footer">
                    生活效率工具箱 · 安全可靠
                </div>
            </section>
        </main>
    </div>

    <!-- Toast 提示容器 -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
